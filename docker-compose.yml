services:
  nginx:
    image: nginx:1.27-alpine
    container_name: stock_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/public:/var/www/html:ro
    depends_on:
      - app
    networks:
      - stocknet

  app:
    build:
      context: ./app
    image: node-stock-app:1.0.0
    container_name: stock_app
    volumes:
      - ./app/public:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-stock_multi_depot}
      DB_USER: ${DB_USER:-stock_user}
      DB_PASSWORD: ${DB_PASSWORD:-stock_pass}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stocknet

  db:
    image: mysql:8.0
    container_name: stock_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-stock_multi_depot}
      MYSQL_USER: ${DB_USER:-stock_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-stock_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - stocknet

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: stock_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - stocknet

volumes:
  db_data:

networks:
  stocknet:
    driver: bridge
