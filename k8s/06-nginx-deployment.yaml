apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: stock-multi-depot
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          # Built from nginx/Dockerfile — static files and config baked in at
          # build time (see Jenkins "Generation de l'image frontend" stage).
          # No initContainer or ConfigMap needed anymore.
          image: ghaith5/node-stock-frontend:1.0.0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: stock-multi-depot
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30090
