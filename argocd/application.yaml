apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stock-multi-depot
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/mrghnighaith/stock-multi-depot.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: stock-multi-depot

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
