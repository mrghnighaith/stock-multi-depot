name: CI/CD - NODE Stock App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  build-and-push:
    name: Build & Push Images
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean up dangling Docker artifacts
        run: docker system prune -f || true

      - name: Lint PHP
        run: |
          chmod +x scripts/lint.sh
          ./scripts/lint.sh

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghaith5/node-stock-app:1.0.0
            ghaith5/node-stock-app:${{ github.run_number }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nginx/Dockerfile
          push: true
          tags: |
            ghaith5/node-stock-frontend:1.0.0
            ghaith5/node-stock-frontend:${{ github.run_number }}

      - name: Deploy to Kubernetes
        run: |
          kubectl -n stock-multi-depot set image deployment/app app=ghaith5/node-stock-app:${{ github.run_number }}
          kubectl -n stock-multi-depot set image deployment/nginx nginx=ghaith5/node-stock-frontend:${{ github.run_number }}
          kubectl -n stock-multi-depot rollout status deployment/app   --timeout=120s
          kubectl -n stock-multi-depot rollout status deployment/nginx --timeout=120s
